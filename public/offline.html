<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>Đang offline · QLBH</title>
    <style>
        * { box-sizing: border-box }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #1e293b; background: #f1f5f9; font: 16px/1.55 system-ui, sans-serif }
        main { width: min(100%, 440px); padding: 28px; border: 1px solid #e2e8f0; border-radius: 20px; background: white; box-shadow: 0 16px 40px #0f172a12 }
        h1 { margin: 0 0 8px; font-size: 22px }
        p { margin: 0 0 20px; color: #475569 }
        button { width: 100%; border: 0; border-radius: 10px; padding: 12px; color: white; background: #4f46e5; font: inherit; font-weight: 700; cursor: pointer }
    </style>
</head>
<body>
    <main>
        <h1>Bạn đang mất kết nối</h1>
        <p>Trang này chưa có bản lưu offline trên thiết bị. Hãy kết nối mạng, mở trang cần dùng ít nhất một lần rồi thử lại. Các thao tác ghi dữ liệu vẫn cần máy chủ, ngoại trừ đơn POS đủ điều kiện đã được xếp hàng trên thiết bị.</p>
        <button type="button" onclick="location.reload()">Thử kết nối lại</button>
    </main>
</body>
</html>
