server:
  host: 127.0.0.1
  port: 9070
  event_url: http://127.0.0.1/api
  camera_key: CHANGE_ME_WITH_THE_KEY_FROM_QLBH
  event_timeout_seconds: 4
  # Add the LAN address/DNS that browsers use to reach this machine.
  webrtc_additional_hosts: []

inference:
  device: AUTO # AUTO, CPU, GPU (Intel), or a configured OpenVINO device
  detector_model: models/face_detection_yunet_2023mar.onnx
  recognizer_model: models/face_recognition_sface_2021dec.onnx
  min_face_px: 40
  detect_fps: 10
  recognition_cooldown_seconds: 4
  match_threshold: 0.72
  match_margin: 0.08

cameras:
  - id: door-1
    name: Camera cua
    enabled: true
    # Luong chinh cua camera, giu de du phong/cau phat.
    ai_rtsp_url: rtsp://user:password@192.168.1.50:554/cam/realmonitor?channel=1&subtype=0
    # H.264 sub-stream. AI doc truc tiep luong nay de khong bi ton frame;
    # MediaMTX dung cung luong nay de phat WebRTC.
    view_rtsp_url: rtsp://user:password@192.168.1.50:554/cam/realmonitor?channel=1&subtype=1
    width: 1280
    height: 720
    zone: entrance
